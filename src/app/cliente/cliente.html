<div class="container">
  <p-card
    header="Cadastro de Cliente"
    subheader="Os dados cadastrados serão utilizados para compras e vendas"
    class="mt-4"
>
    <div class="row mt-4">
      <div class="col-12 col-sm-6 col-md-4">
        <p-floatlabel>
          <input pInputText id="nome" name="nome" type="text" />
          <label for="nome">Nome: *</label>
        </p-floatlabel>
      </div>
      <div class="col-12 col-sm-6 col-md-4">
        <p-floatlabel>
          <input pInputText id="email" name="email" type="text" />
          <label for="nome">Email: *</label>
        </p-floatlabel>
      </div>
    </div>
  </p-card>
</div>
