<div class="container">
  <p-card
    header="Cadastro de Cliente"
    subheader="Os dados cadastrados serão utilizados para compras e vendas"
    class="mt-4"
  >
    <div class="row mt-4">
      <div class="col-12 col-md-6">
        <p-floatlabel>
          <input pInputText id="nome" name="nome" type="text" />
          <label for="nome">Nome: *</label>
        </p-floatlabel>
      </div>
      <div class="col-12 col-sm-6 col-md-3 mt-0">
        <p-floatlabel>
          <p-select
            inputId="tipoPessoa"
            name="tipoPessoa"
            [options]="tipoPessoaOptions"
            optionLabel="descricao"
            optionValue="valor"
            (onChange)="tipoPessoa = $event.value"
          />
          <label for="tipoPessoa">Tipo de pessoa: *</label>
        </p-floatlabel>
      </div>
      <div class="col-12 col-sm-6 col-md-3 mt-0">
        <p-floatlabel>
          <p-inputmask
            inputId="cpfCnpj"
            name="cpfCnpj"
            [mask]="tipoPessoa === 'PJ' ? '99.999.999/9999-99' : '999.999.999-99'"
          />
          <label for="cpfCnpj">Cpf/Cnpj: *</label>
        </p-floatlabel>
      </div>
    </div>
    <div class="row mt-4">
      <div class="col-12 col-sm-7 col-md-8">
        <p-floatlabel>
          <input pInputText id="email" name="email" type="text" />
          <label for="email">Email: *</label>
        </p-floatlabel>
      </div>
      <div class="col-12 col-sm-5 col-md-4 mt-0">
        <p-floatlabel>
          <p-inputmask inputId="telefone" name="telefone" mask="(99) 99999-9999" />
          <label for="telefone">Telefone: *</label>
        </p-floatlabel>
      </div>
    </div>
    <div class="row mt-4">
      <div class="col-12 col-md-3">
        <p-floatlabel>
          <p-inputmask inputId="cep" name="cep" mask="99999-999" />
          <label for="cep">Cep: *</label>
        </p-floatlabel>
      </div>
      <div class="col-12 col-sm-8 col-md-7 mt-0">
        <p-floatlabel>
          <input pInputText id="logradouro" name="logradouro" type="text" />
          <label for="logradouro">Logradouro: *</label>
        </p-floatlabel>
      </div>
      <div class="col-12 col-sm-4 col-md-2 mt-0">
        <p-floatlabel>
          <input pInputText id="numero" name="numero" type="text" />
          <label for="numero">Número: *</label>
        </p-floatlabel>
      </div>
    </div>
    <div class="row mt-4">
      <div class="col-12 col-sm-6">
        <p-floatlabel>
          <input pInputText id="bairro" name="bairro" type="text" />
          <label for="bairro">Bairro: *</label>
        </p-floatlabel>
      </div>
      <div class="col-12 col-sm-6 mt-0">
        <p-floatlabel>
          <input pInputText id="cidade" name="cidade" type="text" />
          <label for="cidade">Cidade: *</label>
        </p-floatlabel>
      </div>
    </div>
    <div class="row mt-4">
      <div class="col-12 col-sm-6 col-md-3 col-lg-2">
        <p-button label="Salvar" severity="success" type="button" />
      </div>
      <div class="col-12 col-sm-6 col-md-3 col-lg-2 mt-0">
        <p-button label="Cancelar" severity="danger" type="button" />
      </div>
    </div>
  </p-card>
</div>
